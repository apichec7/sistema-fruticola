name: Calidad SQA
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app.py models.py servicios_alertas.py
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest --cov --cov-branch --cov-report=xml --cov-report=term-missing --cov-fail-under=60 --junitxml=pytest-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-pruebas
          path: |
            coverage.xml
            pytest-results.xml
  analyze:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install ruff
      - run: ruff check app.py models.py servicios_alertas.py tests/
  report:
    needs: [test, analyze]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '## Resultado del pipeline SQA' >> "$GITHUB_STEP_SUMMARY"
          echo 'Pruebas: ${{ needs.test.result }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Análisis: ${{ needs.analyze.result }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Quality gate
        if: needs.test.result != 'success' || needs.analyze.result != 'success'
        run: exit 1
